name: CI

on:
  push:
    branches: [main, 'task/**']
  pull_request:
    branches: [main, 'task/**']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --package-lock=true
      - name: Check TypeScript
        run: npm run typecheck
      - name: Build application
        run: npm run build
