name: CI

on:
  push:
    branches: [main, 'task/**']
  pull_request:
    branches: [main, 'task/**']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Verify lockfile input
        run: |
          pwd
          ls -la package.json package-lock.json
          node -e "const fs = require('node:fs'); const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8')); console.log('lockfileVersion:', lock.lockfileVersion)"
          npm config get package-lock
      - name: Install dependencies
        run: npm ci --prefix "$GITHUB_WORKSPACE" --package-lock=true --verbose
      - name: Check TypeScript
        run: npm run typecheck
      - name: Build application
        run: npm run build
